name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The version bump is pushed straight to main; the ruleset lets only this app bypass the PR rule
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update package versions
        run: ./scripts/update-version.sh ${{ steps.version.outputs.version }}

      - name: Install dependencies
        run: bun install

      - name: Prepare module
        run: bun run dev:prepare

      - name: Build module
        run: bun run build:module

      - name: Copy README to package
        run: |
          if [ ! -f "packages/nuxt-protokit/README.md" ]; then
            cp README.md packages/nuxt-protokit/README.md
          fi

      - name: Publish to npm
        run: bunx npm publish --workspace=@websideproject/nuxt-protokit --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version updates
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TARGET=${{ github.event.release.target_commitish || github.ref_name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "chore: update version to $VERSION [skip ci]" || echo "No changes to commit"
          git push origin HEAD:$TARGET || echo "No changes to push"
