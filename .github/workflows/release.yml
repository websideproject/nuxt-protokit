name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The version bump is pushed straight to main; the ruleset lets only this app bypass the PR rule
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          # A manual run may be given "v0.1.0"; npm and the skip check below want "0.1.0".
          VERSION=${VERSION#v}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not a version. Publish the release with a vX.Y.Z tag, or run this workflow with a version."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update package versions
        run: ./scripts/update-version.sh ${{ steps.version.outputs.version }}

      - name: Install dependencies
        run: bun install

      - name: Prepare module
        run: bun run dev:prepare

      - name: Build module
        run: bun run build:module

      - name: Copy README to package
        run: |
          if [ ! -f "packages/nuxt-protokit/README.md" ]; then
            cp README.md packages/nuxt-protokit/README.md
          fi

      # npm trusted publishing (OIDC, the id-token permission above): no token. npm never takes a version twice, so a
      # re-run after a publish that went through skips it instead of failing.
      - name: Publish to npm
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [ "$(npm view "@websideproject/nuxt-protokit@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@websideproject/nuxt-protokit@$VERSION is already on npm, skipping"
          else
            bunx npm publish --workspace=@websideproject/nuxt-protokit --provenance --access public
          fi

      - name: Commit version updates
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # A manual run started from a tag has the TAG as ref_name; the bump belongs on the default branch.
          TARGET=${{ github.event.release.target_commitish || github.event.repository.default_branch }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "chore: update version to $VERSION [skip ci]" || echo "No changes to commit"
          git push origin HEAD:$TARGET || echo "No changes to push"
