name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Build module
        run: bun run build:module

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps
      - name: Prepare
        run: bun run dev:prepare
      - name: Test
        run: bun run test

  # Screenshot suite (apps/playground/test/visual.spec.ts): every demo page compared against the committed baselines,
  # which are also the images in the docs (apps/docs/public/screenshots). Refresh with `bun run visual:baseline` in
  # apps/playground — it runs this same container.
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - uses: actions/checkout@v4
      # setup-bun unpacks bun with unzip, which the Playwright image does not have.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Build the playground
        working-directory: apps/playground
        run: bun run build:visual
      # Playwright starts the preview itself (webServer in playwright.config.ts).
      - name: Compare screenshots
        working-directory: apps/playground
        run: bun run test:visual
      - name: Upload the expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: apps/playground/test-results
          retention-days: 14

