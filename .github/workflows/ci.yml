name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Build module
        run: bun run build:module

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps
      - name: Prepare
        run: bun run dev:prepare
      - name: Test
        run: bun run test

  # Screenshot suite (apps/playground/test/visual.spec.ts): every demo page compared against the committed baselines,
  # which are also the images in the docs (apps/docs/public/screenshots). Refresh with `bun run visual:baseline` in
  # apps/playground — it runs this same container.
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - uses: actions/checkout@v4
      # setup-bun unpacks bun with unzip, which the Playwright image does not have.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Build the playground
        working-directory: apps/playground
        run: bun run build:visual
      # Playwright starts the preview itself (webServer in playwright.config.ts).
      - name: Compare screenshots
        working-directory: apps/playground
        run: bun run test:visual
      - name: Upload the expected, actual and diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: apps/playground/test-results
          retention-days: 14

  # Nuxt 5 is not released yet: run the module's typecheck and tests against the nightly so breakage shows up early.
  # Informational — it does not block the pipeline. The nightly is forced for the whole workspace with `overrides`: a
  # `bun add` in the package (as nuxt-auto does) is not enough here, because the package's `nuxt` peer dependency keeps
  # a nested Nuxt 4 that the build would load against the nightly's Nitro.
  test-nuxt-5:
    name: test (nuxt 5 nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Use the Nuxt 5 nightly
        # `5x` is a dist-tag; bun reads it as a version range inside an npm: alias, so resolve it with npm first.
        run: |
          V=$(npm view nuxt-nightly@5x version)
          echo "Nuxt 5 nightly: $V"
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.overrides = {
              'nuxt': 'npm:nuxt-nightly@$V',
              '@nuxt/kit': 'npm:@nuxt/kit-nightly@$V',
              '@nuxt/schema': 'npm:@nuxt/schema-nightly@$V',
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))
          "
          bun install
      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps
      - name: Prepare
        run: bun run dev:prepare
      - name: Typecheck
        working-directory: packages/nuxt-protokit
        run: bun run typecheck
      - name: Test
        working-directory: packages/nuxt-protokit
        run: bun run test

  # PR previews: every pull request publishes an installable build of the module to pkg.pr.new and comments the
  # install command on the PR (README → PR Previews). Needs the pkg.pr.new GitHub App on the repo (installed
  # org-wide): https://github.com/apps/pkg-pr-new. Same job as nuxt-auto's `preview`.
  preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [build, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare
        run: bun run dev:prepare
      - name: Build module
        run: bun run build:module
      - name: Publish preview
        run: bunx pkg-pr-new publish --compact --no-template './packages/nuxt-protokit'
