name: Label PR

# Two kinds of label, both kept in sync on every change to the PR:
#   - one TYPE label from the title's conventional-commit type: it decides the version bump
#     (.github/release-drafter.yml), and `breaking` gets its own release-note section. The `deps` scope (Renovate's
#     `chore(deps): …` / `fix(deps): …`) is labelled `dependencies`, whatever the type;
#   - AREA labels from the paths the PR changes (.github/labeler.yml): the release-note sections (module, playground,
#     docs).
#
# `edited` covers a retitled PR, and a stacked PR retargeted to main (it had no labels while its base was another
# branch).

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  type:
    name: Type label from the title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            // type in the title → label. `!` after the type or scope (feat(module)!:) marks a breaking change.
            const TYPES = {
              breaking: 'breaking',
              feat: 'feature',
              enhancement: 'feature',
              fix: 'bug',
              perf: 'performance',
              performance: 'performance',
              docs: 'documentation',
              refactor: 'refactor',
              test: 'test',
              build: 'build',
              ci: 'ci',
              chore: 'chore',
              style: 'chore',
              revert: 'revert'
            }
            const typeLabels = new Set([...Object.values(TYPES), 'dependencies'])

            const match = /^(\w+)(?:\(([^)]*)\))?(!)?:/.exec(process.env.PULL_REQUEST_TITLE)
            const wanted = !match
              ? undefined
              : match[3] ? 'breaking' : match[2] === 'deps' ? 'dependencies' : TYPES[match[1]]

            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number }
            // Read the labels now, not from the event: another run may have changed them since.
            const current = (await github.rest.issues.listLabelsOnIssue(issue)).data.map(l => l.name)

            for (const name of current) {
              if (typeLabels.has(name) && name !== wanted) await github.rest.issues.removeLabel({ ...issue, name })
            }
            if (wanted && !current.includes(wanted)) await github.rest.issues.addLabels({ ...issue, labels: [wanted] })

  area:
    name: Area labels from the changed paths
    # After the type job: with sync-labels the labeler replaces the PR's label set with what it read when it started,
    # so running both at once removed the type label the other job had just added.
    needs: type
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
