# GitHub's "Generate release notes" button. Releases are drafted by Release Drafter (.github/release-drafter.yml);
# these are the same sections, but GitHub puts each PR only in the FIRST section it matches.
changelog:
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking
    - title: 📦 Module
      labels:
        - 'area: module'
    - title: 🧪 Playground
      labels:
        - 'area: playground'
    - title: 📚 Documentation
      labels:
        - 'area: docs'
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - '*'
