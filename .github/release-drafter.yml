name-template: 'v$RESOLVED_VERSION ✨'
tag-template: 'v$RESOLVED_VERSION'

# Sections are by AREA, from the labels .github/labeler.yml sets from the changed paths; a PR that touches several is
# listed under each. Breaking changes also get their own section first, so none is missed; dependency updates
# (Renovate) get theirs last. A PR in no area (CI, repo tooling) is listed above the sections. The TYPE label (from
# the title) decides the version below.
categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
  - title: '📦 Module'
    labels:
      - 'area: module'
  - title: '🧪 Playground'
    labels:
      - 'area: playground'
  - title: '📚 Documentation'
    labels:
      - 'area: docs'
  - title: '⬆️ Dependencies'
    labels:
      - 'dependencies'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

# While the package is 0.x a breaking change is a minor bump (0.1.0 → 0.2.0). At 1.0, move `breaking` to major.
version-resolver:
  minor:
    labels:
      - 'breaking'
      - 'feature'
      - 'enhancement'
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/websideproject/nuxt-protokit/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
